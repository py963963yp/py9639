name: 用 Wine 在 Linux runner 上运行 Windows exe（根目录文件）

on:
  push:
    branches: [ main ]
  workflow_dispatch:          # 允许手动触发测试

jobs:
  run-exe:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装 Wine（官方 WineHQ 推荐，Ubuntu 24.04 Noble）
        run: |
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          # 用 gpg dearmor 方式导入 key（更安全，推荐）
          wget -O - https://dl.winehq.org/wine-builds/winehq.key | sudo gpg --dearmor -o /etc/apt/keyrings/winehq-archive.key -
          # 直接用 noble（ubuntu-latest 当前是 24.04）
          sudo wget -NP /etc/apt/sources.list.d/ https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources
          sudo apt update
          sudo apt install --install-recommends winehq-stable -y

      - name: 初始化 Wine 环境（避免首次运行弹窗或错误）
        run: wineboot --init || true

      - name: 确保 exe 可执行权限
        run: chmod +x ./boot.exe   # ← 这里改成你的真实 exe 文件名
        
      - name: 安装 Android boot.img 提取工具（magiskboot 或 unpackbootimg）
        run: |
          # 下载 magiskboot（简单、支持 ARM64 kernel 提取）
          wget https://github.com/topjohnwu/Magisk/releases/download/v27.0/magiskboot_linux_x86_64.zip -O magiskboot.zip
          unzip magiskboot.zip
          chmod +x magiskboot
          mv magiskboot /usr/local/bin/magiskboot  # 或放当前目录 ./magiskboot

      - name: 提取 boot.img 中的 kernel 文件
        run: |
          # 用 magiskboot 解包 boot.img
          ./magiskboot unpack ./boot.img
          # 提取后，kernel 文件通常叫 kernel 或 kernel.gz
          ls -la kernel*   # 看日志知道叫什么，通常是 kernel (纯 binary) 或 kernel.gz
          # 如果是 kernel.gz，先解压
          if [ -f kernel.gz ]; then
            gunzip -k kernel.gz   # -k 保留原文件
          fi
          # 最终 kernel 文件应该是 kernel (或 Image)

      

    
      - name: 用 Wine 运行 exe + 自动输入 key
        run: |
          echo "963963Aa@@\n" | wine ./boot.exe "./kernel"

      - name: 查看 exe 处理后生成的文件（调试用，可删除）
        run: ls -la . *.out *.bin *.img *.txt *.new 2>/dev/null || true

      - name: 上传 exe 处理后的结果（供下载）
        uses: actions/upload-artifact@v4
        with:
          name: 处理结果文件
          path: |
            ./*.out      # 根据 exe 实际输出文件扩展名修改
            ./*.bin
            ./*.img
            ./*.txt
            ./*.new
          retention-days: 7   # artifact 保存 7 天